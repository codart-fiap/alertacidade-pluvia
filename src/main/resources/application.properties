spring.application.name=pluvia-api

# Carrega configuração local não versionada (mesmo formato KEY=VALUE de .env).
spring.config.import=optional:file:.env[.properties]

# Banco PostgreSQL. Configure DB_PASSWORD no .env local ou no ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pluvia}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O Hibernate cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (a chave precisa ter pelo menos 32 caracteres; troque fora do desenvolvimento via JWT_SECRET)
app.jwt.secret=${JWT_SECRET:pluvia-chave-dev-local-para-assinatura-jwt-2026}
app.jwt.expiracao-minutos=120

# Chave dos dispositivos IoT (ESP32 / simulador), enviada no cabecalho X-Device-Key (minimo 16 caracteres)
app.device-key=${DEVICE_KEY:pluvia-chave-dispositivo-dev-123}

# Conta ADMIN inicial opcional. Não existe usuário ou senha padrão.
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@pluvia.com}
app.bootstrap.admin-password=${ADMIN_PASSWORD:Admin@123}

# Origens do front-end autorizadas no navegador (separadas por vírgula).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# Evita o usuario/senha aleatorios gerados pelo Spring Security (usamos JWT proprio)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Swagger UI em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
